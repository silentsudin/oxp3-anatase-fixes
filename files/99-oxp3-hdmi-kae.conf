# Panther Lake HDMI keep-alive (KAE) workaround.
#
# On PTL driving a DP-alt/PCON HDMI output, the first 6/8-channel stream after
# KAE has been active can wedge the audio pin: every later stream, including
# stereo, is silent until the display power cycle (reboot/suspend).
#
# Fall back to the older i915 silent-stream path, as the DG2 fix does.
# Installed as /etc/modprobe.d/99-oxp3-hdmi-kae.conf by oxp3-fixes.sh.
options snd_hda_codec_intelhdmi enable_silent_stream=0
