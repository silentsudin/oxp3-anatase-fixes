# OXP3-ONEXPLAYER3-MIC
#
# Card-level override, merged *after* the shipped sof-hda-dsp.conf (see the machine
# profile for why order matters): point the HiFi use case at our wrapper, which keeps
# the shipped use case and adds the internal-microphone device.
#
# Nothing else is changed here; speaker/headphone/HDMI verbs and SOF controls are
# still the shipped profile's.

SectionUseCase."HiFi" {
	File "/oxp3/oxp3-onEXPLAYER3-HiFi.conf"
	Comment "Play HiFi quality Music"
}
