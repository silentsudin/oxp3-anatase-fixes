# OXP3-ONEXPLAYER3-MIC
#
# UCM2 machine profile for the OneXPlayer 3 (card "ONE_NETBOOK-ONEXPLAYER3-Defaultstring",
# driver "sof-hda-dsp").  UCM2 tries conf.d/<driver>/<CardLongName>.conf before
# conf.d/<driver>/<driver>.conf (ucm2/ucm.conf, "confd1"), so this file takes over the
# card on this machine only; the shipped /usr/share/alsa/ucm2 files are never edited.
#
# It loads the shipped profile unchanged - speakers, headphones, HDMI, SOF EQ/DRC byte
# controls and card-init sequences all stay the distribution's - and then applies our
# two overrides as *separate, later* includes.
#
# Why the overrides are separate files: the UCM include pass merges an included file
# into the parent with snd_config_merge(parent, included, 0), which *substitutes*
# duplicate scalar values.  A node declared before an Include is therefore replaced by
# the included value; only a node merged *after* it wins.  Listing our override as the
# second include is what makes its File/JackControl/... values take effect.  (The
# shipped /Intel/sof-hda-dsp/HiFi.conf relies on the same ordering when it includes
# HiFi-sof.conf after HiFi-analog.conf.)
#
# Installed and removed by tools/audio/internal-mic.sh only; the marker line above is
# how that script proves the file is ours before removing it.

Syntax 7

Include.card.File "sof-hda-dsp.conf"
Include.oxp3-case.File "/oxp3/oxp3-onEXPLAYER3-usecase.conf"
