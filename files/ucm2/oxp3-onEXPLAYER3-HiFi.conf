# OXP3-ONEXPLAYER3-MIC
#
# HiFi use case wrapper, merged into the use case *as the verb file* itself.
#
# It includes the shipped use case (/Intel/sof-hda-dsp/HiFi.conf: verb, Headphones,
# Speaker, HDMI, SOF EQ/DRC) first, so a failure to add the device below degrades to
# stock behaviour, never to missing playback devices.  The microphone override is a
# second include because an include substitutes duplicate scalar values: the override
# has to be merged after the shipped devices to win.

Include.shipped.File "/Intel/sof-hda-dsp/HiFi.conf"
Include.oxp3-mic.File "/oxp3/oxp3-onEXPLAYER3-mic.conf"
