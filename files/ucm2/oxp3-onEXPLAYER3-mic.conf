# OXP3-ONEXPLAYER3-MIC
#
# Merged after the shipped HDA mic device (UCM substitutes duplicate scalar values
# from the later include, which is exactly what an override needs).
#
# The ALC245 internal microphone is a *fixed* pin (0x12, "[Fixed] Mic at Int N/A,
# Conn = Digital").  The shipped profile gates its only capture device on the external
# "Mic Jack" control, which reads off while nothing is in the 3.5 mm combo jack, so
# PipeWire marks the only source "not available" and nothing is labelled internal.
# 'Internal Mic Phantom Jack' is the codec's fake jack for the fixed internal pin and
# is always "on", which is the correct availability model for this input.  The codec
# keeps doing its own auto-mic switching, so a plugged headset still selects pin 0x19
# on the same PCM.
#
# The whole device is re-declared (not just JackControl) so it stays valid even if a
# future UCM parser replaces instead of merging the SectionDevice subtree; every value
# except Comment/JackControl/CaptureMasterElem is the shipped one.

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId}"
		CaptureMixerElem "Capture"
		CaptureVolume "Capture Volume"
		CaptureSwitch "Capture Switch"
		CaptureMasterElem "Internal Mic Boost"
		JackControl "Internal Mic Phantom Jack"
	}
}
