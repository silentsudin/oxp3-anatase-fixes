# Installed by oxp3-anatase-fixes as
#   /etc/systemd/user/anatase-gamemode.service.d/50-oxp3-xess.conf
#
# Gamemode (gamescope, Steam and every game started from it) reads the XeSS XMX settings from the
# package's own file each time it starts, instead of trusting the user manager's environment.
#
# Why: that environment is shared and gets overwritten. On 2026-11-24 the login manager brought back
# the copy of it from boot, taken just after the old xess-xmx-check had stripped the XMX variables
# (ANV_CM_HELPER= and VKD3D_DISABLE_EXTENSIONS= empty, the stock VK_DRIVER_FILES list). It did that on
# every desktop/Gamemode switch, so whether a game got XMX or DP4a depended on the order of switches.
#
# EnvironmentFile overrides what the manager hands down (systemd keeps the single-quoted Windows path
# with its backslashes); UnsetEnvironment drops what a split-driver install or the old check left
# behind. The leading '-' keeps Gamemode starting when XeSS XMX is not installed.
[Service]
EnvironmentFile=-%h/.config/environment.d/50-xess-xmx.conf
UnsetEnvironment=VK_DRIVER_FILES VK_ICD_FILENAMES ANV_CM_KERNEL_DIR XMX_IGC_DIR
