# Keep the OneXPlayer 3 IMU on the dedicated BMI260 driver.
#
# The device's IMU is ACPI 10EC5280 on I2C1 (_SB.PC00.I2C1.SPBA).  Mainline
# bmi160_i2c also matches that ACPI id (it carries a DSDT workaround commented
# as "broken firmware"), and when it wins the probe the sensor comes up
# misdetected/dead.  The Anatase kernel builds CONFIG_BMI260 (drivers/custom/
# bmi260, from https://github.com/hhd-dev/bmi260) and this module option keeps
# the generic bmi160 driver out of the way.
#
# Installed on this machine as /etc/modprobe.d/oxp3-bmi160.conf since
# 2025-11-08.  Reinstall after a fresh ostree image:
#   sudo install -m 0644 files/oxp3-bmi160.conf /etc/modprobe.d/oxp3-bmi160.conf
#   sudo modprobe -r bmi160_i2c 2>/dev/null; sudo modprobe bmi260_i2c
#   tools/oxp3-imu.py selftest
blacklist bmi160_i2c
