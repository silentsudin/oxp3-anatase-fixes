# OneXPlayer 3 default MangoHud configuration: the patched build (patches/mangohud)
# reads Intel iGPU power/memory from the process fdinfo and CPU power from the
# averaged RAPL counter published by our privileged helper, so these keys show
# real values instead of N/A on the Arc B390.
gpu_stats
gpu_temp
gpu_power
gpu_voltage
cpu_stats
cpu_temp
cpu_power
fps
frame_timing
position=top-left
font_size=22
background_alpha=0.35
