# oxp3 - systemd-logind power-key / lid / sleep-key policy for the OneXPlayer 3.
#
# Installed as /etc/systemd/logind.conf.d/60-oxp3-sleep.conf by
#     sudo tools/oxp3-hw-install.sh --sleep
# and removed again by
#     sudo tools/oxp3-hw-install.sh --uninstall --sleep
#
# Why this file exists (docs/hw/sleep-power.md sections 2.1 and 2.5):
#
#   * The host shipped NO logind configuration at all. systemd-analyze
#     cat-config systemd/logind.conf printed only "[Login]", so the compiled-in
#     defaults applied - and systemd's default for HandlePowerKey is "poweroff",
#     not "suspend". A power key press that logind does answer therefore shuts
#     the machine down instead of sleeping it.
#   * The handheld has no other suspend trigger: KDE PowerDevil holds a "block"
#     inhibitor on handle-power-key/handle-lid-switch (so logind is not allowed
#     to act on those events), Steam only calls logind when its own power action
#     runs, and nothing disables idle auto-suspend because PowerDevil's
#     AutoSuspendAction is 0.
#
# Semantics worth remembering (verified against systemd 262, see the doc):
#   * Handle*= decides what logind does with the *event* it receives.
#   * A "block" inhibitor of type handle-* makes logind drop the event entirely;
#     it does NOT stop an explicit org.freedesktop.login1.Manager.Suspend call.
#   * Only a "block" inhibitor of type "sleep" refuses an actual suspend.
#
# Hibernate is deliberately not wired to any key: /sys/power/disk is [disabled]
# under the integrity lockdown and there is no swap, so logind can only fail it
# (kernel logs "hibernation is restricted"). Long-press power stays poweroff,
# which is the emergency action a handheld needs.

[Login]
HandlePowerKey=suspend
HandleSuspendKey=suspend
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKeyLongPress=poweroff
