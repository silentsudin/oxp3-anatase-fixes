# vkBasalt config for the OXP3 saturation shader.
#
# Template: tools/display/vibrance.sh install substitutes the two at-tokens
# used below (the shader path and the include/texture directory) and writes the
# result to ~/.config/oxp3-vkbasalt.conf.  Edit this template, not the
# installed copy, if you want the change to survive a re-install.
#
# vkBasalt syntax (0.3.2.x): one `effects = a:b:c` list plus a `<name> = <path>`
# line per effect.  Toggle in game with the key below.

effects = oxp3_vibrance
enableOnLaunch = True
toggleKey = Home

# Where vkBasalt looks for textures/includes referenced by ReShade FX files.
# Our shader is deliberately self-contained (no #include), but set them anyway
# so future effects behave.
reshadeTexturePath = "@INCLUDE@"
reshadeIncludePath = "@INCLUDE@"

# The shader itself.  Uniform defaults come from the .fx file:
#   Vibrance = 0, Saturation = 0, VibranceProtect = 0.65, KeepLuma = off
# i.e. a no-op until you edit the values below and restart the game.
oxp3_vibrance = "@FX@"

# Per-game starting points (copy whichever fits into the .fx uniform defaults,
# or into the installed config if your vkBasalt build supports per-key
# overrides):
#
#   "washed out" sRGB game on this wide-gamut panel:  Vibrance = 35
#   oversaturated port that ignores the profile:      Vibrance = -25
#   anime/2D art that needs punch without skin shift: Vibrance = 50, VibranceProtect = 0.85
#   night-time / eye comfort:                         Saturation = -40
