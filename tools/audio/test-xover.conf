# Test-only graphs: Linkwitz-Riley 4th-order crossover at 10.12 kHz.
#
# The vendor preset moves a crossover/high-pass corner to 10.12 kHz
# (params 259-264 in docs/hw/audio-harman-apo.md) but the shipped
# oxp3-speaker-eq.conf does not implement it.  This file exists so
# tools/audio/test-isolation.sh can prove in a real PipeWire graph that the
# corner is implementable and that the two bands sum sensibly:
#
#   LR4 = two cascaded 2nd-order Butterworth sections (Q = 0.7071)
#   LR4 low + LR4 high = 2nd-order allpass -> flat magnitude
#   each branch alone is -6 dB at the corner
#
# Three independent filter chains are loaded:
#   audiotest_xover.in/out  low + high summed (must be flat)
#   audiotest_low.in/out    low branch only
#   audiotest_high.in/out   high branch only
# so the bands can be measured individually as well as summed.
#
# This file is NOT installed on the host and is not part of the speaker EQ
# chain.  Node names are audiotest_* so they can never collide with the real
# sink.  Node order matters: filter-chain uses the first node's input and the
# last node's output as the graph's default ports (and makes one instance per
# channel).
context.modules = [
    # ---- summed LR4 pair ---------------------------------------------------
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "OXP3 auditest crossover sum (LR4 10.12 kHz)"
            media.name       = "OXP3 auditest crossover sum"
            filter.graph = {
                nodes = [
                    { type = builtin name = split label = copy }
                    { type = builtin name = lp1 label = bq_lowpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = lp2 label = bq_lowpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = hp1 label = bq_highpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = hp2 label = bq_highpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = mix label = mixer }
                ]
                links = [
                    { output = "split:Out" input = "lp1:In" }
                    { output = "split:Out" input = "hp1:In" }
                    { output = "lp1:Out" input = "lp2:In" }
                    { output = "hp1:Out" input = "hp2:In" }
                    { output = "lp2:Out" input = "mix:In 1" }
                    { output = "hp2:Out" input = "mix:In 2" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "audiotest_xover.in"
                node.description = "OXP3 auditest crossover sum in"
                media.class      = "Audio/Sink"
                priority.driver  = 9000
                priority.session = 9000
            }
            playback.props = {
                node.name    = "audiotest_xover.out"
                node.passive = true
                node.target  = "iso_null"
            }
        }
    }
    # ---- low branch only ---------------------------------------------------
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "OXP3 auditest crossover low band"
            media.name       = "OXP3 auditest crossover low"
            filter.graph = {
                nodes = [
                    { type = builtin name = lp1 label = bq_lowpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = lp2 label = bq_lowpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                ]
                links = [
                    { output = "lp1:Out" input = "lp2:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "audiotest_low.in"
                node.description = "OXP3 auditest crossover low in"
                media.class      = "Audio/Sink"
                priority.driver  = 8900
                priority.session = 8900
            }
            playback.props = {
                node.name    = "audiotest_low.out"
                node.passive = true
                node.target  = "iso_null"
            }
        }
    }
    # ---- high branch only --------------------------------------------------
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "OXP3 auditest crossover high band"
            media.name       = "OXP3 auditest crossover high"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp1 label = bq_highpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                    { type = builtin name = hp2 label = bq_highpass
                      control = { "Freq" = 10120 "Q" = 0.7071 } }
                ]
                links = [
                    { output = "hp1:Out" input = "hp2:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "audiotest_high.in"
                node.description = "OXP3 auditest crossover high in"
                media.class      = "Audio/Sink"
                priority.driver  = 8800
                priority.session = 8800
            }
            playback.props = {
                node.name    = "audiotest_high.out"
                node.passive = true
                node.target  = "iso_null"
            }
        }
    }
]
