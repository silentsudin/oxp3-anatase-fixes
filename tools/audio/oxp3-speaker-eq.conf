# OneXPlayer 3 internal-speaker EQ, reproduced from the vendor Harman AudioEFX preset.
#
# Numbers come from HKLM\SOFTWARE\Harman\AudioEFX\Parameters\
#   {DFF21CE1-F70F-11D0-B917-00A0C9223196}\Settings\2   (KSNODETYPE_SPEAKER, active preset)
# extracted with tools/audio/apo_extract.py.  See docs/hw/audio-harman-apo.md for the
# parameter table, the reasoning behind each stage and how to roll this back.
#
# Install (user scope, no root):  tools/audio/install-user.sh
# On/off:                         tools/audio/eq-on.sh | tools/audio/eq-off.sh
#
# The chain is:  headroom -> 8 peaking bands (vendor stage 1, stored twice in the
# vendor blob, bit-identical for left and right) and optionally the vendor stage 2
# (all-cut resonance control) appended at the end of the node list.
#
# `headroom` is a low shelf parked at 20 kHz used as a flat static gain.  The
# default generated chain is the LOUD profile (-4 dB): it is 4 dB louder than
# the old -8 dB chain, but the vendor limiter (threshold 0.607 = -4.3 dBFS)
# cannot be reproduced with bq_* filters (this PipeWire build has no dynamics
# builtin and no LADSPA/LV2 limiter is installed), so a 0 dBFS tone that hits the
# +7.74 dB stage-1 peak at 142 Hz clips by ~3.74 dB.  That is the deliberate
# trade-off.
#
# install-user.sh --safe (or eq-on.sh --safe) replaces the Gain below with -8 dB,
# which is exactly stage 1's peak boost: the safe chain cannot clip at full scale.
# install-user.sh asks tools/audio/eq_response.py for the number, so this file and
# the model cannot drift apart.  A real limiter is only available through
# EasyEffects (see docs/hw/audio-harman-apo.md).

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "OXP3 Speaker (Harman EQ)"
            media.name       = "OXP3 Speaker (Harman EQ)"
            filter.graph = {
                nodes = [
                    { type = builtin name = headroom label = bq_lowshelf
                      control = { "Freq" = 20000 "Q" = 0.7 "Gain" = -4 } }

                    # --- vendor stage 1: voicing (param offsets 19 and 69) -------
                    { type = builtin name = b1  label = bq_peaking
                      control = { "Freq" = 80    "Q" = 0.7 "Gain" = -3 } }   # sub cut
                    { type = builtin name = b2  label = bq_peaking
                      control = { "Freq" = 140   "Q" = 2.0 "Gain" = 6 } }    # bass lift
                    { type = builtin name = b3  label = bq_peaking
                      control = { "Freq" = 140   "Q" = 1.5 "Gain" = 3 } }    # bass lift (wide)
                    { type = builtin name = b4  label = bq_peaking
                      control = { "Freq" = 400   "Q" = 0.9 "Gain" = 3 } }    # body
                    { type = builtin name = b5  label = bq_peaking
                      control = { "Freq" = 4500  "Q" = 2.0 "Gain" = -2 } }   # harshness
                    { type = builtin name = b6  label = bq_peaking
                      control = { "Freq" = 6500  "Q" = 2.0 "Gain" = -4 } }   # cone breakup
                    { type = builtin name = b7  label = bq_peaking
                      control = { "Freq" = 7500  "Q" = 2.0 "Gain" = -4 } }   # cone breakup
                    { type = builtin name = b8  label = bq_peaking
                      control = { "Freq" = 10000 "Q" = 3.0 "Gain" = 3 } }    # air

                    # --- vendor stage 2 (param offset 1435): optional ----------
                    # All-cut, narrow-Q block; the vendor blob stores it once, not
                    # per channel.  Uncomment to hear the full vendor preset.
                    # { type = builtin name = s1 label = bq_peaking
                    #   control = { "Freq" = 95    "Q" = 0.7  "Gain" = -3 } }
                    # { type = builtin name = s2 label = bq_peaking
                    #   control = { "Freq" = 250   "Q" = 4.0  "Gain" = -3 } }
                    # { type = builtin name = s3 label = bq_peaking
                    #   control = { "Freq" = 400   "Q" = 0.9  "Gain" = -3 } }
                    # { type = builtin name = s4 label = bq_peaking
                    #   control = { "Freq" = 650   "Q" = 3.0  "Gain" = -5 } }
                    # { type = builtin name = s5 label = bq_peaking
                    #   control = { "Freq" = 700   "Q" = 3.0  "Gain" = -2 } }
                    # { type = builtin name = s6 label = bq_peaking
                    #   control = { "Freq" = 4500  "Q" = 4.5  "Gain" = -7 } }
                    # { type = builtin name = s7 label = bq_peaking
                    #   control = { "Freq" = 7000  "Q" = 4.0  "Gain" = -6 } }
                    # { type = builtin name = s8 label = bq_peaking
                    #   control = { "Freq" = 13000 "Q" = 7.0  "Gain" = -4 } }
                    # { type = builtin name = s9 label = bq_peaking
                    #   control = { "Freq" = 15000 "Q" = 0.7  "Gain" = -3 } }
                ]
                links = [
                    { output = "headroom:Out" input = "b1:In" }
                    { output = "b1:Out" input = "b2:In" }
                    { output = "b2:Out" input = "b3:In" }
                    { output = "b3:Out" input = "b4:In" }
                    { output = "b4:Out" input = "b5:In" }
                    { output = "b5:Out" input = "b6:In" }
                    { output = "b6:Out" input = "b7:In" }
                    { output = "b7:Out" input = "b8:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "oxp3_speaker_eq.sink"
                node.description = "OXP3 Speaker (Harman EQ)"
                media.class      = "Audio/Sink"
                priority.driver  = 10000
                # Above the internal speaker sink (1000) so the EQ sink stays the default
                # output, but below the real microphone (2000): the sink's monitor source
                # inherits this value, and must not outrank the codec input for default-source.
                priority.session = 1500
            }
            # Pin the filtered output to the real hardware sink.  Without a target
            # WirePlumber would route it to the current default sink, which is this
            # very EQ sink once eq-on.sh made it default -> feedback loop.
            # install-user.sh rewrites this line if the detected sink name differs.
            playback.props = {
                node.name   = "oxp3_speaker_eq.out"
                node.passive = true
                node.target = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
            }
        }
    }
]
