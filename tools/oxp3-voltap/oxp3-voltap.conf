# /etc/oxp3-voltap.conf - environment for oxp3-voltap.service
# Every value can be overridden on the command line as well (see --help).

# Which device carries the rocker.  "auto" uses the topology discovery:
#   * NEVER hhd's own virtual volume keyboard ("Handheld Daemon Volume
#     Keyboard", phys=phys-hhd-vbtn) by default.  hhd needs that device, and a
#     second EVIOCGRAB on it makes hhd's own grab fail with EBUSY ("Assuming
#     controllers disconnected"), which drops the emulated Steam controller.
#     The supported path is the hhd plugin: tools/hhd-oxp3-voltap;
#   * grab the physical AT keyboard only when it is free (hhd stopped or
#     controller mode disabled);
#   * when hhd owns the only rocker path, OBSERVE: one clear journal line, JSON
#     status state=degraded-hhd-protected and exit code 4, nothing opened and
#     nothing grabbed, retry every VOLTAP_RESCAN_S;
#   * if a grab is refused, log DEGRADED once, write the JSON status and keep
#     retrying (see VOLTAP_DEGRADE_EXIT_S).
# An explicit list disables discovery; the candidates are tried in order and the
# first grabbable one is used (non-volume keys are still proxied).  An explicit
# hhd virtual device is refused unless VOLTAP_ALLOW_HHD_GRAB=1:
#   VOLTAP_DEVICES="/dev/input/event4"
VOLTAP_DEVICES="auto"

# Automatic topology preference: auto (physical if free, then hhd last resort),
# physical, or hhd-virtual.  hhd-virtual has no effect without
# VOLTAP_ALLOW_HHD_GRAB=1.
VOLTAP_PREFER="auto"

# DANGEROUS last resort, default off: allow EVIOCGRAB on hhd's own virtual
# volume keyboard.  While we hold it hhd cannot open/grab it and drops the
# controller for a few seconds.  The supported path is the hhd plugin
# (tools/hhd-oxp3-voltap), so only set this for a deliberate experiment.
VOLTAP_ALLOW_HHD_GRAB=0

# Extra name/phys regexes used when VOLTAP_DEVICES is "auto".  Empty disables
# them: the role patterns below already identify the two known devices.
VOLTAP_NAME=""
VOLTAP_PHYS=""

# How the two roles are recognised (regex, case-insensitive).
VOLTAP_HHD_NAME="Handheld Daemon Volume Keyboard"
VOLTAP_HHD_PHYS="hhd-vbtn"
VOLTAP_ATKBD_NAME="AT Translated Set 2 keyboard"
VOLTAP_ATKBD_PHYS="isa0060/serio0"

# 0 = never fall back to the physical AT keyboard (explicit --device still
# works).
VOLTAP_ALLOW_PHYSICAL=1

# ms the synthesised press is held; one mixer step per press.
VOLTAP_HOLD_MS=30
# ms after a tap in which another press is treated as contact bounce.
VOLTAP_GAP_MS=60
# ms watchdog: a press that never ends is released anyway.
VOLTAP_MAX_HOLD_MS=500
# Treat a release without a press as one physical press (hhd's uinput device
# emits only the release once the kernel force-releases the scancode).
VOLTAP_ORPHAN_TAP=1
# Print counters to the journal every N seconds (0 = off).
VOLTAP_STATS=0
# Seconds between device/holder rescans (hhd recreates its uinput device).
VOLTAP_RESCAN_S=1

# JSON status: which device was grabbed or why the grab was refused.
VOLTAP_STATUS_FILE=/run/oxp3-voltap/status.json
# Exit after N seconds in a degraded/observe state with its code (3 refused,
# 4 hhd-protected observe; 0 = retry forever).  Leave 0 in the service:
# systemd Restart=always would loop on a conflict.
VOLTAP_DEGRADE_EXIT_S=0
