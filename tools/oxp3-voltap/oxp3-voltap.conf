# /etc/oxp3-voltap.conf - environment for oxp3-voltap.service
# Every value can be overridden on the command line as well (see --help).

# Which device carries the rocker.  By default the shim sits on the volume
# keyboard that hhd publishes ("Handheld Daemon Volume Keyboard",
# phys=phys-hhd-vbtn): hhd grabs the AT keyboard, so that device is the only
# place the desktop ever sees the volume keys.
#
# If hhd is not installed, point VOLTAP_DEVICES at the device that carries the
# rocker instead (find it with: sudo oxp3-voltap check).  An explicit list
# disables the name/phys match:
#   VOLTAP_DEVICES="/dev/input/event4"      # the AT keyboard, see the doc!
# The AT keyboard needs --force (it advertises EV_REP), so use the unit's
# ExecStart with:  /usr/local/libexec/oxp3-voltap run --force
VOLTAP_DEVICES="auto"

# Name/phys patterns used when VOLTAP_DEVICES is "auto".
VOLTAP_NAME="Handheld Daemon Volume Keyboard"
VOLTAP_PHYS="phys-hhd-vbtn"

# ms the synthesised press is held; one mixer step per press.
VOLTAP_HOLD_MS=30
# ms after a tap in which another press is treated as contact bounce.
VOLTAP_GAP_MS=60
# ms watchdog: a press that never ends is released anyway.
VOLTAP_MAX_HOLD_MS=500
# Treat a release without a press as one physical press (hhd's uinput device
# emits only the release once the kernel force-releases the scancode).
VOLTAP_ORPHAN_TAP=1
# Print counters to the journal every N seconds (0 = off).
VOLTAP_STATS=0
