# /etc/oxp3-voltap.conf - environment for oxp3-voltap.service
# Every value can be overridden on the command line as well (see --help).

# Which device carries the rocker.  "auto" uses the topology discovery:
#   * prefer hhd's virtual volume keyboard ("Handheld Daemon Volume Keyboard",
#     phys=phys-hhd-vbtn) when it exists - hhd already owns the physical AT
#     keyboard, so a second EVIOCGRAB there would fail with EBUSY;
#   * fall back to the physical AT keyboard only when no hhd virtual device is
#     selectable and the holder scan shows nothing else holds it;
#   * if every grab is refused, log DEGRADED once, write the JSON status and
#     keep retrying (see VOLTAP_DEGRADE_EXIT_S).
# An explicit list disables discovery; the candidates are tried in order and the
# first grabbable one is used (the unit needs no --force; non-volume keys are
# still proxied):
#   VOLTAP_DEVICES="/dev/input/event4"
VOLTAP_DEVICES="auto"

# Automatic topology preference: auto (hhd virtual first), hhd-virtual, or
# physical.  "physical" is only useful on a machine without hhd.
VOLTAP_PREFER="auto"

# Extra name/phys regexes used when VOLTAP_DEVICES is "auto".  Empty disables
# them: the role patterns below already identify the two known devices.
VOLTAP_NAME=""
VOLTAP_PHYS=""

# How the two roles are recognised (regex, case-insensitive).
VOLTAP_HHD_NAME="Handheld Daemon Volume Keyboard"
VOLTAP_HHD_PHYS="hhd-vbtn"
VOLTAP_ATKBD_NAME="AT Translated Set 2 keyboard"
VOLTAP_ATKBD_PHYS="isa0060/serio0"

# 0 = never fall back to the physical AT keyboard (explicit --device still
# works).
VOLTAP_ALLOW_PHYSICAL=1

# ms the synthesised press is held; one mixer step per press.
VOLTAP_HOLD_MS=30
# ms after a tap in which another press is treated as contact bounce.
VOLTAP_GAP_MS=60
# ms watchdog: a press that never ends is released anyway.
VOLTAP_MAX_HOLD_MS=500
# Treat a release without a press as one physical press (hhd's uinput device
# emits only the release once the kernel force-releases the scancode).
VOLTAP_ORPHAN_TAP=1
# Print counters to the journal every N seconds (0 = off).
VOLTAP_STATS=0
# Seconds between device/holder rescans (hhd recreates its uinput device).
VOLTAP_RESCAN_S=1

# JSON status: which device was grabbed or why the grab was refused.
VOLTAP_STATUS_FILE=/run/oxp3-voltap/status.json
# Exit with 3 after N seconds in a degraded state (0 = retry forever).
# Leave 0 in the service: systemd Restart=always would loop on a conflict.
VOLTAP_DEGRADE_EXIT_S=0
