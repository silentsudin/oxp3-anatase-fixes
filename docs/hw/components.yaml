# Single source of truth for OneXPlayer 3 component status.
#
# Every per-component fact that docs/hw/README.md (state matrix),
# docs/INSTALL-HW.md (install/verify matrix) and README.md (summary) show is
# defined here once. tools/gen-docs.py validates this file and renders the three
# generated blocks; never edit those blocks by hand.
#
# Schema, vocabulary and contribution rules: docs/hw/REGISTRY.md.
# Supported YAML subset: block mappings/sequences, plain and quoted scalars,
# booleans, integers, single-line flow sequences. No anchors, tags or block
# scalars (see docs/hw/REGISTRY.md "YAML subset").
#
# Order in this file is the order of the generated tables.

schema: 1

# Whole-system checks that run before the per-component rows. They are not
# components themselves, so they live here rather than in the component list.
global_checks:
  - label: Install state
    command: "tools/oxp3-hw-install.sh --status"
    expect: "one line per component; yes and enabled/active for what is installed; exit 0"
  - label: Verification harness
    command: "tools/oxp3-verify.sh --json"
    expect: "JSON report; exit 0 with at least one PASS, 1 on any FAIL, 2 when nothing passed, 3 on usage error"
  - label: Repo status matrix
    command: "tools/oxp3-status.sh --json"
    expect: "schema 1 report with per-indicator ok/warn/fail/unknown and an overall state"
  - label: Harness self-test
    command: "tests/verify/run.sh"
    expect: "every parser asserted against tests/verify/fixtures; exit 0"

unmapped_checks: {}

components:
  # -------------------------------------------------------------------------
  # Driver stack (installed by oxp3-fixes*.sh; summarised in README.md)
