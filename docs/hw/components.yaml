  - id: gamescope
    title: Gamescope
    state: working
    group: driver-stack
    headline: true
    summary: "PQ HDR on the internal SDC AMS881KB01 OLED with no black screens, real peak brightness and the HDR brightness slider; VRR frame-pacing fixes from gamescope 3.16.29/3.17.0 and 30-144 Hz modes, from patches/gamescope."
    implementation:
      - patches/gamescope
      - oxp3-fixes-fast.sh
      - oxp3-fixes.sh
    doc: docs/hw/hdr-vibrance.md
    root_required: "yes"
    install:
      summary: "Anatase's gamescope rebuilt with patches/gamescope and installed into the writable /usr overlay"
      entrypoint: "./oxp3-fixes-fast.sh install"
      steps:
        - "rebuild after every Anatase update; the overlay install is lost on the next deployment"
    verify:
      - command: "rpm -q gamescope"
        expect: "a gamescope build newer than stock with the .oxp3 build date"
    dependencies: []
    caveats:
      - "installed into the /usr overlay, so it must be reapplied after every Anatase update"
      - "HDR inside the Gamemode session is the only privileged part; the two gamescope flags are in hdr-vibrance.md 5.2"
    last_validated:
      date: 2026-11-08
      evidence: "docs/WORKING-BUILD-2026-11-08.md records gamescope-3.16.23.3-1.fc45.oxp3.202610292302 as the working build; HDR/WCG reproduction in docs/hw/hdr-vibrance.md"

