      entrypoint: "sudo tools/oxp3-hw-install.sh --volume"
      steps:
        - "alternative: sudo tools/oxp3-voltap/install.sh install --hwdb"
        - "never combine the two: both normalise the same key"
    verify:
      - id: vol.unit
        expect: "oxp3-voltap is active (running)"
      - id: vol.grab
        expect: "this boot's journal has grabbed /dev/input/eventN"
      - id: vol.hwdb
